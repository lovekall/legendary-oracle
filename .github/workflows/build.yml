name: Build APK

on:
  workflow_dispatch:   # lets you start it with a button
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Downloads the original WrithDeck project directly (no upload needed)
      - uses: actions/checkout@v4
        with:
          repository: luginf/writhdeck-android
          ref: 842652653f4c397562b784a32729671686757c0e
          path: src

      - name: Apply Lollipop (Android 5) changes
        run: |
          cat > patch_lollipop.py <<'PYEOF'
          import re
          import sys

          root = sys.argv[1]

          def sub(path, old, new, required=True):
              p = root + "/" + path
              s = open(p, encoding="utf-8").read()
              if old not in s:
                  msg = "pattern not found in " + path + ": " + old[:60]
                  if required:
                      raise AssertionError(msg)
                  print("SKIPPED:", msg)
                  return
              open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
              print("patched", path)

          E = "app/src/main/java/com/writhdeck/app/ui/EditorScreen.kt"
          sub(
              E,
              """        importantForAutofill = View.IMPORTANT_FOR_AUTOFILL_NO
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {""",
              """        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      importantForAutofill = View.IMPORTANT_FOR_AUTOFILL_NO
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {""",
              required=False,
          )
          sub(
              E,
              """    override fun getAutofillType(): Int {""",
              """    @androidx.annotation.RequiresApi(Build.VERSION_CODES.O)
              override fun getAutofillType(): Int {""",
              required=False,
          )
          sub(
              E,
              """    var selectionChangeListener: (() -> Unit)? = null
          """,
              """    var selectionChangeListener: (() -> Unit)? = null
              var scrollYListener: ((Int) -> Unit)? = null

              override fun onScrollChanged(horiz: Int, vert: Int, oldHoriz: Int, oldVert: Int) {
                  super.onScrollChanged(horiz, vert, oldHoriz, oldVert)
                  scrollYListener?.invoke(vert)
              }
          """,
              required=False,
          )
          sub(
              E,
              """setOnScrollChangeListener { _, _, scrollY, _, _ ->""",
              """scrollYListener = { scrollY ->""",
              required=False,
          )

          # Guard Android 6.0 (API 23+) insertion action mode callback calls so Android 5.1 (API 22)
          # does not throw NoSuchMethodError when FlingEditText is created.
          editor_path = root + "/" + E
          editor_src = open(editor_path, encoding="utf-8").read()

          # Guard property assignment: customInsertionActionModeCallback = ...
          editor_src, prop_count = re.subn(
              r"(?m)^([ \t]*)(customInsertionActionModeCallback\s*=\s*[^\n]+)$",
              r"\1if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) { \2 }",
              editor_src,
          )
          # Guard method call: setCustomInsertionActionModeCallback(...)
          editor_src, call_count = re.subn(
              r"(?m)^([ \t]*)(setCustomInsertionActionModeCallback\([^\n]*\))$",
              r"\1if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) { \2 }",
              editor_src,
          )
          # If overridden inside FlingEditText, annotate with @RequiresApi(Build.VERSION_CODES.M)
          editor_src, override_count = re.subn(
              r"(?m)^([ \t]*)(override fun setCustomInsertionActionModeCallback\b)",
              r"\1@androidx.annotation.RequiresApi(Build.VERSION_CODES.M)\n\1\2",
              editor_src,
          )
          open(editor_path, "w", encoding="utf-8").write(editor_src)
          print(
              f"patched insertion callback in {E}: "
              f"prop={prop_count}, call={call_count}, override={override_count}"
          )

          sub(
              "app/src/main/java/com/writhdeck/app/StateStore.kt",
              "state.daily.getOrDefault(path, emptyMap())",
              "(state.daily[path] ?: emptyMap())",
              required=False,
          )

          G = "app/build.gradle.kts"
          sub(G, "minSdk = 26", "minSdk = 21", required=False)
          sub(
              G,
              """    compileOptions {
                  sourceCompatibility""",
              """    compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility""",
              required=False,
          )
          sub(
              G,
              """    debugImplementation("androidx.compose.ui:ui-tooling")""",
              """    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.3")

              debugImplementation("androidx.compose.ui:ui-tooling")""",
              required=False,
          )

          N = "app/src/main/java/com/writhdeck/app/ui/AppNavigation.kt"
          sub(
              N,
              "import com.writhdeck.app.WrithdeckViewModel\n",
              "import com.writhdeck.app.WrithdeckViewModel\nimport kotlinx.coroutines.flow.first\n",
              required=False,
          )
          sub(
              N,
              """        if (pendingExternalOpen) {
                      vm.consumeExternalOpen()
                      if (nav.currentDestination?.route == "browser") {
                          nav.navigate("editor") { launchSingleTop = true }
                      }
                  }""",
              """        if (pendingExternalOpen) {
                      val entry = nav.currentBackStackEntryFlow.first()
                      vm.consumeExternalOpen()
                      if (entry.destination.route == "browser") {
                          nav.navigate("editor") { launchSingleTop = true }
                      }
                  }""",
              required=False,
          )

          V = "app/src/main/java/com/writhdeck/app/WrithdeckViewModel.kt"
          sub(
              V,
              "import kotlinx.coroutines.flow.asStateFlow\n",
              "import kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.flow.first\nimport kotlinx.coroutines.CoroutineExceptionHandler\n",
              required=False,
          )
          sub(
              V,
              """    fun openExternalContent(uri: Uri, contentResolver: ContentResolver, canWrite: Boolean) {
                  viewModelScope.launch {
                      _isScratchpad.value = false
          """,
              """    fun openExternalContent(uri: Uri, contentResolver: ContentResolver, canWrite: Boolean) {
                  val errHandler = CoroutineExceptionHandler { _, e ->
                      android.os.Handler(android.os.Looper.getMainLooper()).post {
                          android.widget.Toast.makeText(
                              getApplication<Application>(),
                              "Could not open file: " + e.javaClass.simpleName + ": " + e.message,
                              android.widget.Toast.LENGTH_LONG
                          ).show()
                      }
                  }
                  viewModelScope.launch(errHandler) {
                      _engineReady.first { it }
                      _isScratchpad.value = false
          """,
              required=False,
          )

          M = "app/src/main/java/com/writhdeck/app/MainActivity.kt"
          sub(
              M,
              """        val uri = intent.data ?: return
          """,
              """        val uri = intent.data ?: run {
                      android.widget.Toast.makeText(this, "WrithDeck: no file in request", android.widget.Toast.LENGTH_LONG).show()
                      return
                  }
                  android.widget.Toast.makeText(this, "WrithDeck: opening " + uri, android.widget.Toast.LENGTH_LONG).show()
          """,
              required=False,
          )
          sub(
              M,
              """        super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
          """,
              """        super.onCreate(savedInstanceState)
                  installCrashLogger()
                  enableEdgeToEdge()
          """,
              required=False,
          )
          sub(
              M,
              """    override fun onNewIntent(intent: Intent) {""",
              """    private fun installCrashLogger() {
                  val prefs = getSharedPreferences("crashlog", android.content.Context.MODE_PRIVATE)
                  prefs.getString("last", null)?.let { msg ->
                      android.widget.Toast.makeText(this, "WrithDeck crashed: " + msg, android.widget.Toast.LENGTH_LONG).show()
                      prefs.edit().remove("last").commit()
                  }
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          val root: Throwable = generateSequence<Throwable>(error) { it.cause }.last()
                          val where = error.stackTrace.plus(root.stackTrace)
                              .filter { it.className.startsWith("com.writhdeck") }
                              .take(3).joinToString(" < ") { it.fileName + ":" + it.lineNumber }
                          val top = root.stackTrace.firstOrNull()?.let { it.className.substringAfterLast('.') + "." + it.methodName + ":" + it.lineNumber } ?: "?"
                          prefs.edit().putString("last", root.javaClass.simpleName + ": " + root.message + " [" + top + "] @ " + where).commit()
                          try {
                              val dir = java.io.File(
                                  android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOCUMENTS),
                                  "writhdeck"
                              )
                              dir.mkdirs()
                              java.io.File(dir, "crash-log.txt").writeText(android.util.Log.getStackTraceString(error))
                          } catch (_: Throwable) {}
                      } catch (_: Throwable) {}
                      previous?.uncaughtException(thread, error)
                  }
              }

              override fun onNewIntent(intent: Intent) {""",
              required=False,
          )

          sub(
              E,
              """    override fun sendAccessibilityEventUnchecked(event: android.view.accessibility.AccessibilityEvent) {
                  if (length() < 10000) {""",
              """    private fun safeLength(): Int = (getText() as CharSequence?)?.length ?: 0

              override fun sendAccessibilityEventUnchecked(event: android.view.accessibility.AccessibilityEvent) {
                  if (safeLength() < 10000) {""",
              required=False,
          )
          sub(
              E,
              "return if (length() < 10000) super.getAutofillType()",
              "return if (safeLength() < 10000) super.getAutofillType()",
              required=False,
          )
          sub(
              E,
              "pageMarkOffset > length()) return",
              "pageMarkOffset > safeLength()) return",
              required=False,
          )
          PYEOF
          python3 patch_lollipop.py src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Same signing key on every build, so each new APK installs over the old one
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          validate-wrappers: false   # the project's wrapper jar isn't used; we run Gradle directly

      - name: Build
        working-directory: src
        run: gradle assembleFreeDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: writhdeck-apk
          path: src/app/build/outputs/apk/**/*.apk
