name: Build APK

on:
  workflow_dispatch:   # lets you start it with a button
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: writhdeck-apk
          path: app/build/outputs/apk/**/*.apk
